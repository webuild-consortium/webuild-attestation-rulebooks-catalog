name: Rulebook explorer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time, and never cancel a half finished publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-index:
    name: Check the index is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the build dependencies
        run: python3 -m pip install --quiet "markdown==3.11.2"
      - name: Verify the generated files match the rulebooks
        run: python3 explorer/scripts/build_index.py --check

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check-index
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: explorer
      - id: deployment
        uses: actions/deploy-pages@v4
