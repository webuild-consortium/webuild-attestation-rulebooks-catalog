<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attestation Rulebook Explorer</title>
<link rel="icon" href="assets/favicon.svg" id="favicon">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="masthead">
  <div class="bar">
    <a class="brand" id="brandLink" href="#">
      <img id="brandLogo" alt="" height="44">
    </a>
    <span class="brand-sep" aria-hidden="true"></span>
    <span class="brand-product" id="brandProduct">Rulebook Explorer</span>
    <nav class="masthead-links">
      <a id="repoLink" href="#" target="_blank" rel="noopener" aria-label="View the repository on GitHub" title="View on GitHub">
        <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
    </nav>
  </div>
</header>

<div class="hero">
  <div class="hero-inner">
    <label class="sr-only" for="q">Search the rulebooks</label>
    <div class="searchwrap">
      <svg class="searchicon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.2-4.2"></path>
      </svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search an attribute, a rulebook or a vct value">
      <button id="clear" type="button" class="clear" hidden aria-label="Clear">&times;</button>
    </div>
    <p class="hero-hint">
      <span id="pageTagline"></span>
      <span class="examples">Try
        <button type="button" class="eg" data-q="legal_name">legal_name</button>
        <button type="button" class="eg" data-q="iban">iban</button>
        <button type="button" class="eg" data-q="birth">birth</button>
      </span>
    </p>
  </div>
</div>

<main>
  <section class="controls" aria-label="Filters">
    <div class="filters">
      <div class="filtergroup">
        <span class="filterlabel">Category</span>
        <div id="catFilters" class="chips"></div>
      </div>
      <span class="filtersep" aria-hidden="true"></span>
      <div class="filtergroup">
        <span class="filterlabel">Format</span>
        <div id="fmtFilters" class="chips"></div>
      </div>
      <div class="filtergroup">
        <span class="filterlabel">Match</span>
        <div class="chips">
          <button class="chip mode is-on" data-mode="all">Anything</button>
          <button class="chip mode" data-mode="attributes">Attributes only</button>
        </div>
      </div>
    </div>
  </section>

  <p class="resultline">
    <span id="resultCount"></span>
    <span id="summary" class="summary"></span>
    <button id="reset" type="button" class="linkbtn" hidden>Reset</button>
    <span class="sortwrap">
      <svg class="sorticon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"></path>
      </svg>
      <label class="sr-only" for="sort">Sort</label>
      <select id="sort">
        <option value="name">Name A to Z</option>
        <option value="name-desc">Name Z to A</option>
        <option value="attrs">Most attributes</option>
        <option value="attrs-asc">Fewest attributes</option>
        <option value="category">Category</option>
      </select>
    </span>
  </p>

  <section id="results" class="results" aria-live="polite"></section>
  <p id="empty" class="empty" hidden>Nothing matches. Try a shorter term or clear the filters.</p>

  <nav id="pager" class="pager" aria-label="Pages" hidden>
    <button type="button" class="pagebtn" data-step="-1" aria-label="Previous page">&lsaquo;</button>
    <span id="pageList" class="pagelist"></span>
    <button type="button" class="pagebtn" data-step="1" aria-label="Next page">&rsaquo;</button>
    <span class="pagesize">
      <label class="sr-only" for="perPage">Per page</label>
      <select id="perPage">
        <option value="12">12 per page</option>
        <option value="24" selected>24 per page</option>
        <option value="48">48 per page</option>
        <option value="0">Show all</option>
      </select>
    </span>
  </nav>
</main>

<footer class="foot">
  <div class="foot-band">
    <div class="foot-inner">
      <img id="footLogo" class="foot-logo" alt="" height="56">
      <img id="footEu" class="foot-eu" alt="Co-funded by the European Union" height="46">
    </div>
  </div>
  <div class="foot-base">
    <div class="foot-inner">
      <span id="copyright" class="copyright"></span>
      <span class="gen">Index built <span id="generated"></span> from the rulebooks in this repository.</span>
    </div>
  </div>
</footer>

<dialog id="detail" class="detail">
  <button class="close" id="closeDetail" aria-label="Close">Close</button>
  <div id="detailBody"></div>
</dialog>

<script src="assets/app.js"></script>
</body>
</html>
